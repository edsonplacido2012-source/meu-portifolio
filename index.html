<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Alana - Portfólio de Desenhos</title>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Bale&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #6eb88d;
      color: #9b68dd;
      font-family: 'Bale', Arial, sans-serif;
      text-align: center;
      padding: 50px;
      margin: 0;
    }

    h1 {
      color: #9b68dd;
      font-size: 48px;
      margin-bottom: 5px;
      font-family: 'UnifrakturMaguntia', cursive;
    }

    .subtitulo {
      font-size: 20px;
      color: #9b68dd;
      margin-bottom: 50px;
    }

    h2 {
      color: #9b68dd;
      font-size: 30px;
      margin-bottom: 20px;
      font-family: 'UnifrakturMaguntia', cursive;
    }

    .galeria {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .card {
      background-color: #4a0080;
      border-radius: 12px;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0b3ff;
      font-size: 16px;
    }
    .sobre {
      background-color: #4a0080;
      border-radius: 16px;
      padding: 30px;
      max-width: 600px;
      margin: 0 auto 50px auto;
    }
    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      transition: transform 0.3s ease;
    }

    .card:hover img {
      transform: scale(1.1);
    }

    .card {
      overflow: hidden;
      cursor: pointer;
    }
    .foto-perfil {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      margin: 0 auto 20px auto;
      border: 4px solid #9b68dd;
    }

    .foto-perfil img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card {
      position: relative;
    }

    .card-titulo {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(74, 0, 128, 0.85);
      color: #e0b3ff;
      padding: 8px;
      font-size: 14px;
      opacity: 0;
      transition: opacity 0.3s ease;
      border-radius: 0 0 12px 12px;
    }

    .card:hover .card-titulo {
      opacity: 1;
    }
    }
  </style>
</head>
<body>

  <h1>Alana</h1>
  <div class="foto-perfil">
    <img src="img/eu.jpeg" alt="Foto de perfil">
  </div>
  <p class="subtitulo">Amo desenhar desde pequena, vem ver minha evolução! ✏️</p>
  <section class="sobre">
    <h2>Sobre mim</h2>
    <p>Oi! Eu sou a Alana, tenho 14 anos e amo desenhar desde pequena.</p>
    <p>Aqui você vai encontrar minha evolução como artista — cada desenho conta uma história!</p>
  </section>
  <h2>Meus Desenhos</h2>
  <div class="galeria">
<div class="card">
      <img src="img/alanadesenho.jpeg" alt="Alya dentro do mar">
        <div class="card-titulo">Alya dentro do mar</div>
    </div>
    <div class="card">
      <img src="img/alanadesenho-2.jpeg" alt="Alya">
       <div class="card-titulo">Alya</div>
    </div>
    <div class="card">
      <img src="img/alanadesenho-3.jpeg" alt=É assim que acaba?">
        <div class="card-titulo">É assim que acaba</div>
    </div>
    <div class="card">
      <img src="img/alanadesenho-4.jpeg" alt="Ginastica">
          <div class="card-titulo">Ginástica</div>
    </div>
  </div>

</body>
</html>
