<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Alana - Portfólio de Desenhos</title>
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Bale&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #6eb88d;
      color: #9b68dd;
      font-family: 'Bale', Arial, sans-serif;
      text-align: center;
      padding: 50px;
      margin: 0;
    }

    h1 {
      color: #9b68dd;
      font-size: 48px;
      margin-bottom: 5px;
      font-family: 'UnifrakturMaguntia', cursive;
    }

    .subtitulo {
      font-size: 20px;
      color: #9b68dd;
      margin-bottom: 50px;
    }

    h2 {
      color: #9b68dd;
      font-size: 30px;
      margin-bottom: 20px;
      font-family: 'UnifrakturMaguntia', cursive;
    }

    .galeria {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
    }

    .card {
      background-color: #4a0080;
      border-radius: 12px;
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #e0b3ff;
      font-size: 16px;
    }
    .sobre {
      background-color: #4a0080;
      border-radius: 16px;
      padding: 30px;
      max-width: 600px;
      margin: 0 auto 50px auto;
    }
  </style>
</head>
<body>

  <h1>Alana</h1>
  <p class="subtitulo">Amo desenhar desde pequena, vem ver minha evolução! ✏️</p>
  <section class="sobre">
    <h2>Sobre mim</h2>
    <p>Oi! Eu sou a Alana, tenho 14 anos e amo desenhar desde pequena.</p>
    <p>Aqui você vai encontrar minha evolução como artista — cada desenho conta uma história!</p>
  </section>
  <h2>Meus Desenhos</h2>
  <div class="galeria">
    <div class="card">Desenho 1</div>
    <div class="card">Desenho 2</div>
    <div class="card">Desenho 3</div>
    <div class="card">Desenho 4</div>
  </div>

</body>
</html>
